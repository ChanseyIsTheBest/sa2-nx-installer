<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Re-encode Test</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --text: #111; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111; --text: #eee; } }
  :root[data-theme="dark"] { --bg: #111; --text: #eee; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<!-- culdcept-nx-installer (2026-11-20): sound files re-encoded to Opus in this browser (audio_worker.js: the XMA frames
     decoded in WebAssembly, WebCodecs' Opus encoder, the .xmo written), each as the installer does it; the first one's
     .xmo written to serve.py's --test-out file (check it with culdcept-nx's out/test_xmo.exe). Serve with
       python serve.py 8193 . --test-files <game folder> --test-out <NAME.xma.xmo>
     and open http://127.0.0.1:8193/test/audio_browser.html?files=data/SOUND/bgm_01_01.xma,data/SOUND/se_001.xma -->
<h1>Audio re-encode test</h1>
<pre id="log"></pre>
<script type="module">
import { soundIds, xmoBitrate } from '../lib/xmo.js';
const out = document.getElementById('log');
const log = (t) => { out.textContent += t + '\n'; };
const files = (new URLSearchParams(location.search).get('files') || 'data/SOUND/bgm_01_01.xma').split(',');
const game = await (await fetch('../game.json')).json();
const all = (await (await fetch('/_test_list')).json()).map((e) => e.path || e).filter((p) => /\.xma$/i.test(p));
const ids = soundIds(all);
const w = new Worker('../audio_worker.js', { type: 'module' });
const ready = await new Promise((r) => w.addEventListener('message', ({ data }) => r(data), { once: true }));
log(`audio worker ready: Opus encoder ${ready.opus ? 'available' : 'NOT available'}`);
let first = true;
for (const path of files) {
  const bytes = new Uint8Array(await (await fetch(`/_test/${path.split('/').map(encodeURIComponent).join('/')}`)).arrayBuffer());
  const size = bytes.length, channels = bytes[20 + 12 + 17];
  const bitrate = xmoBitrate(game.audio.bitrates, path, channels);
  const t0 = performance.now();
  w.postMessage({ id: 1, bytes, sound: ids.get(path), bitrate }, [bytes.buffer]);
  const r = await new Promise((res) => w.addEventListener('message', ({ data }) => res(data), { once: true }));
  const s = ((performance.now() - t0) / 1000).toFixed(2);
  if (!r.bytes) { log(`${path}: kept as XMA: ${r.why} (${s} s)`); continue; }
  const pre = new DataView(r.bytes.buffer, r.bytes.byteOffset).getUint16(42, true);
  log(`${path}: id ${ids.get(path).toString(16).toUpperCase()}, ${channels} ch at ${bitrate / 1000}k: ${size} -> ` +
      `${r.bytes.length} bytes (${(100 * r.bytes.length / size).toFixed(1)} %), ${r.frames} frames, pre-skip ${pre}, ${s} s`);
  if (first) {
    const put = await fetch('/_test_write?offset=0', { method: 'POST', body: r.bytes });
    log(`  written to the test output: ${put.status}`);
    first = false;
  }
}
log('DONE');
</script>
</body>
</html>
